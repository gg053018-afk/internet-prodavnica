{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija</title>
    <link rel="stylesheet" href="{% static 'proizvodi/style.css' %}">
</head>
<body>
   <div class="stranica-registracije">

{% include 'proizvodi/navigacija.html' %}

<h1>Registracija korisnika</h1>

<p>{{ poruka }}</p>

<form method="POST" action="">
    {% csrf_token %}

    <label>Korisničko ime:</label>
    <input type="text" name="korisnicko_ime" required>
    <br>

    <label>e mail:</label>
    <input type="email" name="e_mail" required>
    <br>

    <label>Lozinka:</label>
    <input type="password" name="lozinka" required>
    <br>

    <label>Potvrdi lozinku:</label>
    <input type="password" name="potvrda_lozinke" required>
    <br>

    <button type="submit">Registruj se</button>

</form>

</div>
</body>
</html>
