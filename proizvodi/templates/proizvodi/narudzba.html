{% load static %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{% static 'proizvodi/style.css' %}">

<div class="stranica-narudzbe">

    {% include 'proizvodi/navigacija.html' %}

<h1>Narudžba</h1>

<p class="poruka-greske">{{ poruka }}</p>

<p class="podaci-narudzbe">Podaci za narudžbu</p>

<form method="POST">
    {% csrf_token %}

    <label>Ime:</label>
    <input type="text" name="ime" required>
    <br>

    <label>Prezime:</label>
    <input type="text" name="prezime" required>
    <br>

    <label>Adresa:</label>
    <input type="text" name="adresa" required>
    <br>

    <label>Grad:</label>
    <input type="text" name="grad" required>
    <br>

    <label>Poštanski broj:</label>
    <input type="text" name="postanski_broj" required>
    <br>

    <label>Broj telefona:</label>
    <input type="tel" name="telefon" required>
    <br>

    <label>E-mail:</label>
    <input type="email" name="email" required>
    <br>

<button type="submit" class="dugme-potvrdi">Potvrdi narudžbu</button>

</form>
</div>
